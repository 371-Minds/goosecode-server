name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # Lint — shellcheck all bash scripts
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck entrypoint.sh run.sh github-setup.sh install-goose.sh update-goose-api.sh \
            goose-api/docker-integration.sh goose-api/install-to-container.sh

  # ---------------------------------------------------------------------------
  # Build — base Docker image
  # ---------------------------------------------------------------------------
  build-base:
    name: Build base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: goosecode-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Build — distro images
  # ---------------------------------------------------------------------------
  build-distros:
    name: Build distro images
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
    strategy:
      matrix:
        distro: [goose-akash, goose-vercel, goose-mindport, goose-picollm, goose-mii, goose-mnn, goose-ryzenai, goose-exllamav3, goose-envminds]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image (needed as ARG BASE_IMAGE)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: goosecode-server:latest
          cache-from: type=gha

      - name: Build ${{ matrix.distro }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distros/${{ matrix.distro }}/Dockerfile
          push: false
          tags: ${{ matrix.distro }}:ci
          build-args: |
            BASE_IMAGE=goosecode-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Integration test — start base container, hit the Goose API health endpoint
  # ---------------------------------------------------------------------------
  integration:
    name: Integration test
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: goosecode-server:latest
          cache-from: type=gha

      - name: Start container (no Goose AI — API key not needed for health check)
        run: |
          docker run -d \
            --name goosecode-test \
            -p 8080:8080 \
            -p 8000:8000 \
            -e OPENAI_API_KEY=sk-test-placeholder \
            -e PASSWORD=testpass \
            -e ENABLE_TERMINAL_SHARING=true \
            -e ENABLE_GOOSE_API=true \
            goosecode-server:latest

      - name: Wait for VS Code Server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "VS Code Server is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Wait for Goose API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/docs > /dev/null 2>&1; then
              echo "Goose API is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Verify Goose API docs endpoint
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8000/docs)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: Verify sessions endpoint (unauthenticated → 403)
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8000/api/sessions)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "403" ]

      - name: Print container logs on failure
        if: failure()
        run: docker logs goosecode-test

      - name: Stop container
        if: always()
        run: docker stop goosecode-test || true

  # ---------------------------------------------------------------------------
  # Push to GHCR — only on main/master branch
  # ---------------------------------------------------------------------------
  push:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    needs: [lint, build-base, build-distros, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata — base
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push goose-akash distro
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distros/goose-akash/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/goose-akash:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push goose-vercel distro
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distros/goose-vercel/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/goose-vercel:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push goose-mindport distro
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distros/goose-mindport/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/goose-mindport:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push goose-picollm distro
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distros/goose-picollm/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/goose-picollm:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push goose-mii distro
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distros/goose-mii/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/goose-mii:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push goose-mnn distro
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distros/goose-mnn/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/goose-mnn:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push goose-ryzenai distro
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distros/goose-ryzenai/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/goose-ryzenai:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push goose-exllamav3 distro
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distros/goose-exllamav3/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/goose-exllamav3:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push goose-envminds distro
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distros/goose-envminds/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/goose-envminds:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
